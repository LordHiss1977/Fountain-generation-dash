<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{font-family:var(--font-body);background:var(--surface-page);color:var(--text-body)}#root{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}.row{display:flex;flex-wrap:wrap;gap:18px;align-items:center}.span{grid-column:1/-1}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Field, Input, Select, Checkbox, Radio, Switch, Icon } = window.FountainHydroPowerDesignSystem_39598f;
function App(){
  const [p,setP] = React.useState('semana');
  return <>
    <Field label="Orden de trabajo" htmlFor="a" hint="Formato OT-0000">
      <Input id="a" placeholder="Buscar orden" iconLeft={<Icon name="search" size={16} />} />
    </Field>
    <Field label="Unidad" htmlFor="b">
      <Select id="b" options={[{value:'1',label:'Unidad 1'},{value:'2',label:'Unidad 2'}]} />
    </Field>
    <Field label="Horas" htmlFor="c" error="Valor fuera de rango.">
      <Input id="c" defaultValue="512" invalid />
    </Field>
    <Field label="Responsable" htmlFor="d" required>
      <Input id="d" placeholder="Nombre y apellido" />
    </Field>
    <div className="span row">
      <Checkbox label="Incluir trabajos planificados" defaultChecked />
      <Checkbox label="Solo desviaciones" />
      <Radio name="p" checked={p==='semana'} onChange={()=>setP('semana')} label="Semanal" />
      <Radio name="p" checked={p==='mes'} onChange={()=>setP('mes')} label="Mensual" />
      <Switch label="Vista compacta" defaultChecked />
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

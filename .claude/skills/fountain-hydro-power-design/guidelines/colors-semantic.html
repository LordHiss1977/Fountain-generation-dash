<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-body);background:var(--surface-page);padding:16px 20px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{border:1px solid var(--border-subtle);border-radius:var(--radius-md)}.b{height:38px;border-bottom:1px solid var(--border-subtle);border-radius:var(--radius-md) var(--radius-md) 0 0}.n{padding:6px 8px;font:400 10px/1.4 var(--font-mono);color:var(--text-muted)}</style></head><body>
<div class="g">
<div class="c"><div class="b" style="background:var(--surface-page)"></div><div class="n">--surface-page</div></div>
<div class="c"><div class="b" style="background:var(--surface-muted)"></div><div class="n">--surface-muted</div></div>
<div class="c"><div class="b" style="background:var(--surface-sunken)"></div><div class="n">--surface-sunken</div></div>
<div class="c"><div class="b" style="background:var(--surface-brand-soft)"></div><div class="n">--surface-brand-soft</div></div>
<div class="c"><div class="b" style="background:var(--surface-brand)"></div><div class="n">--surface-brand</div></div>
<div class="c"><div class="b" style="background:var(--surface-inverse)"></div><div class="n">--surface-inverse</div></div>
<div class="c"><div class="b" style="background:var(--accent-primary)"></div><div class="n">--accent-primary</div></div>
<div class="c"><div class="b" style="background:var(--accent-primary-hover)"></div><div class="n">--accent-primary-hover</div></div>
</div></body></html>

<!-- @dsCard group="Colors" viewport="700x120" name="Status" subtitle="Colour never carries meaning alone — always paired with a label" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-body);background:var(--surface-page);padding:16px 20px}.r{display:flex;gap:10px;flex-wrap:wrap}.p{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:5px 13px 5px 11px;font:600 12px/1 var(--font-brand);letter-spacing:.04em}.d{width:8px;height:8px;border-radius:50%}.t{font:400 11px/1.5 var(--font-body);color:var(--text-muted);margin-top:12px}</style></head><body>
<div class="r">
<span class="p"><span class="d" style="background:var(--status-success)"></span>Operativa</span>
<span class="p"><span class="d" style="background:var(--status-warning)"></span>Mantenimiento planificado</span>
<span class="p"><span class="d" style="background:var(--status-info)"></span>Informativo</span>
<span class="p"><span class="d" style="background:var(--status-danger)"></span>Fuera de servicio</span>
<span class="p"><span class="d" style="background:var(--color-gray-400)"></span>Sin datos</span>
</div>
<p class="t">--status-success #80C34F · --status-warning #E29D3E · --status-info #30ACEC · --status-danger #D64A3B</p>
</body></html>

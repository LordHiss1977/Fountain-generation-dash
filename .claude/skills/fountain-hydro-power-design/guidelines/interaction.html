<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-body);background:var(--surface-page);padding:16px 20px}.r{display:flex;gap:12px;align-items:center}.b{font:600 14px/1 var(--font-brand);letter-spacing:.04em;color:#fff;padding:11px 18px;border-radius:var(--radius-md);border:1px solid transparent}.n{font:400 10px/1.6 var(--font-mono);color:var(--text-muted);text-align:center;margin-top:6px}</style></head><body>
<div class="r">
<div><div class="b" style="background:#008bb2">Reposo</div><div class="n">teal-600</div></div>
